<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign In — Northbridge Community Portal</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 420px;
            margin: 80px auto;
            padding: 24px;
            color: #222;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 10px
        }

        h1 {
            font-size: 18px
        }

        input {
            display: block;
            width: 100%;
            padding: 9px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2c5f9c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            margin-top: 6px;
            cursor: pointer
        }

        p.note {
            font-size: 12px;
            color: #888;
            margin-top: 16px
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 11px
        }
    </style>
</head>

<body>
    <h1>Sign in to Northbridge Community Portal</h1>
    <p class="note">Please sign in to view this content.</p>
    <input type="text" placeholder="Username" disabled>
    <input type="password" placeholder="Password" disabled>
    <button>Sign In</button>
    <p class="note">Not a member? Registration is currently invite-only.</p>
    <footer>© 2026 Northbridge Community Portal</footer>
</body>

</html>
